<style>
:root{--bg:#0f1720;--panel:#151f2b;--card:#1b2836;--line:#26364a;--ink:#e6edf5;--mut:#8ea3ba;--acc:#37b6a4;--loc:#2fa876;--vaz:#c8912f;--ind:#7a8697;--done:#1e3a2c;--warn:#d9a441;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:5;background:#0f1720;border-bottom:1px solid var(--line);padding:12px 18px}
.htop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto}h1{font-size:16px;margin:0;font-weight:650}h1 span{color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-size:13px;font-weight:600}
.tab.on{background:var(--acc);border-color:var(--acc);color:#04231f}
.bar{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1180px;margin-left:auto;margin-right:auto}
.search{flex:1;min-width:200px;max-width:440px;padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px}
.search:focus{outline:none;border-color:var(--acc)}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-weight:650;cursor:pointer}
.btn:hover{background:var(--acc);color:#04231f}.btn.solid{background:var(--acc);color:#04231f}.btn.ghost{border-color:var(--line);color:var(--mut)}
main{padding:14px 18px 80px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}

/* injeta o token de sessão em TODA chamada à API, sem precisar editar cada fetch */
(function(){
  const _fetch=window.fetch.bind(window);
  const PUB=/action=(ping|login|trocaSenha)/;
  window.fetch=function(url,opt){
    try{
      if(typeof url==='string'&&url.indexOf(API)===0&&!PUB.test(url)){
        // GET: garante &token= na query
        if(!opt||(opt.method||'GET').toUpperCase()==='GET'){
          if(url.indexOf('token=')<0)url+=(url.indexOf('?')<0?'?':'&')+'token='+encodeURIComponent(TOKEN);
        }else if(opt&&opt.body&&typeof opt.body==='string'){
          // POST: injeta token no corpo JSON se ainda não houver
          try{const b=JSON.parse(opt.body);if(b&&!b.token&&!PUB.test('action='+(b.action||''))){b.token=TOKEN;opt=Object.assign({},opt,{body:JSON.stringify(b)});}}catch(e){}
        }
      }
    }catch(e){}
    return _fetch(url,opt);
  };
})();

/* ═══ HELPERS BÁSICOS ═══

function eH(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function aiHoje(){var d=new Date();return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();}
async function aiPost(obj){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj||{})});
  const d=await r.json();
  if(d&&d.precisaLogin){telaLogin();throw new Error('login');}
  return d;
}
function setSync(estado){
  const box=document.getElementById('sync'),txt=document.getElementById('syncTxt');
  if(!box||!txt)return;
  box.classList.remove('saving','err');
  if(estado==='saving'){box.classList.add('saving');txt.textContent='salvando...';}
  else if(estado==='err'){box.classList.add('err');txt.textContent='erro ao salvar';}
  else txt.textContent='sincronizado';
}
let _toastT=null;
function toast(msg,desfazer){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);}
  const esconde=function(){clearTimeout(_toastT);el.classList.remove('on');};
  el.innerHTML='<span>'+eH(msg)+'</span>';
  if(typeof desfazer==='function'){
    const u=document.createElement('button');u.textContent='desfazer';
    u.onclick=async function(){esconde();try{await desfazer();}catch(e){setSync('err');}};
    el.appendChild(u);
  }
  const x=document.createElement('button');x.textContent='×';x.onclick=esconde;el.appendChild(x);
  el.classList.remove('on');
  requestAnimationFrame(function(){el.classList.add('on');});
  clearTimeout(_toastT);_toastT=setTimeout(esconde,desfazer?9000:4000);

function rotBloco(x){
  if(x.tipo==='sn'){
    const aberto=x.resposta==='Sim';
    const filhos=x.filhos||[];
    const linhaFilho=f=>`<div class="htask" style="cursor:pointer;padding-left:26px" onclick="rotToggle('${eH(f.id)}',${f.feito?0:1})">
      <div class="hbox ${f.feito?'done':''}" style="${f.feito?'background:#5fd6a0;border-color:#5fd6a0':''}">${f.feito?'✓':''}</div>
      <div class="tt" style="${f.feito?'opacity:.5;text-decoration:line-through':''}">${eH(f.texto)}</div></div>`;
    return `<div class="rotBlocoSN" data-id="${eH(x.id)}" style="border-left:2px solid ${x.concluido?'#5fd6a0':(x.resposta?'#e9c15f':'rgba(255,255,255,.08)')};padding-left:8px;margin:4px 0">
      <div class="htask" style="flex-wrap:wrap">
        <div class="tt" style="flex:1;min-width:180px">${eH(x.texto)}</div>
        <button class="btn ${x.resposta==='Sim'?'solid':'ghost'}" style="padding:2px 10px" onclick="rotResponder('${eH(x.id)}','Sim')">Sim</button>
        <button class="btn ${x.resposta==='Não'?'solid':'ghost'}" style="padding:2px 10px" onclick="rotResponder('${eH(x.id)}','Não')">Não</button>
      </div>
      ${aberto?filhos.map(linhaFilho).join(''):''}
    </div>`;
  }
  return `<div class="htask" style="cursor:pointer" onclick="rotToggle('${eH(x.id)}',${x.feito?0:1})">
    <div class="hbox ${x.feito?'done':''}" style="${x.feito?'background:#5fd6a0;border-color:#5fd6a0':''}">${x.feito?'✓':''}</div>
    <div class="tt" style="${x.feito?'opacity:.5;text-decoration:line-through':''}">${eH(x.texto)}</div></div>`;
}
async function rotToggle(id,feito){
  const el=event&&event.currentTarget;      // captura AGORA (some após o await)
  if(el){                                     // optimistic: muda o visual na hora
    const box=el.querySelector('.hbox'),tt=el.querySelector('.tt');
    if(feito){if(box){box.style.background='#5fd6a0';box.style.borderColor='#5fd6a0';box.textContent='✓';box.classList.add('done');}if(tt){tt.style.opacity='.5';tt.style.textDecoration='line-through';}}
    else{if(box){box.style.background='';box.style.borderColor='';box.textContent='';box.classList.remove('done');}if(tt){tt.style.opacity='';tt.style.textDecoration='';}}
    el.setAttribute('onclick',"rotToggle('"+id+"',"+(feito?0:1)+")"); // inverte para o próximo clique
  }
  rotAtualizarContador(feito?1:-1);
  try{await aiPost({action:'rotinaMarcar',id,feito:!!feito});}   // grava em segundo plano
  catch(e){if(el){el.style.outline='2px solid #ff8a8a';setTimeout(()=>{el.style.outline='';},1500);}} // falhou: sinaliza
}
/* Responder Sim/Não recalcula quantos passos existem hoje (Sim revela sub-passos, Não não),
   então é mais simples buscar o estado atualizado do servidor e redesenhar só a rotina. */
async function rotResponder(id,resposta){
  try{await aiPost({action:'rotinaResponder',id,resposta});}
  catch(e){toast('Falha ao responder. Tente de novo.');return;}
  const r=await aiPost({action:'rotinaDia'});
  rotina=r.itens||[];rotFeitos=r.feitos||0;rotTotal=r.total||0;
  $('#rotWrap').innerHTML=rotina.map(rotBloco).join('');
  const c=$('#rotCont');if(c)c.textContent=rotFeitos+'/'+rotTotal;
}
function rotAtualizarContador(delta){
  rotFeitos=Math.max(0,rotFeitos+delta);
  const c=$('#rotCont');if(c)c.textContent=rotFeitos+'/'+rotTotal;
}
async function rotinaEditar(){

     <div class="msg" style="margin-top:4px">Perguntas sim/não e seus sub-passos condicionais são criados junto no modelo padrão; aqui você adiciona itens simples de checkbox.</div>
     <div style="margin-top:6px"><button class="btn ghost" onclick="telaHoje()">✓ concluir edição</button></div>`;

/* ---- Repasses: calendário ---- */
let repMes=new Date().getMonth(), repAno=new Date().getFullYear(), repItens=[];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const ANO_MIN=new Date().getFullYear()-2,ANO_MAX=new Date().getFullYear()+2; // faixa do seletor de competência
async function telaRepasses(){
  $('#list').style.display='none';$('#rateioView').style.display='';$('#state').textContent='';
  await fetchAba('Proprietários');
  try{const r=await fetch(API+'?action=listarRepasses');const d=await r.json();repItens=d.itens||[];}catch(e){repItens=[];}
  renderRepasses();
}
// dia efetivo no mês (antecipa p/ sexta se cair fim de semana)
function diaEfetivo(dia,mes,ano){
  var d=new Date(ano,mes,dia); if(d.getMonth()!==mes)return null; // dia inexistente no mês
  var dow=d.getDay(); var ant=false;
  if(dow===6){d.setDate(d.getDate()-1);ant=true;}      // sábado -> sexta
  else if(dow===0){d.setDate(d.getDate()-2);ant=true;} // domingo -> sexta
  return {dia:d.getDate(), mesReal:d.getMonth(), antecipado:ant, original:dia};
}
function renderRepasses(){
  const v=$('#rateioView');
  const primeiro=new Date(repAno,repMes,1).getDay();
  const nDias=new Date(repAno,repMes+1,0).getDate();
  const hoje=new Date();
  // mapa dia-do-mês -> [{nome, antecipado, original}]
  const porDia={};
  repItens.forEach(it=>{
    const ef=diaEfetivo(Number(it['Dia']),repMes,repAno);
    if(ef&&ef.mesReal===repMes){(porDia[ef.dia]=porDia[ef.dia]||[]).push({nome:it['Proprietário'],ant:ef.antecipado,orig:it['Dia']});}
  });
  const dow=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let cal='<div class="calgrid">'+dow.map(d=>`<div class="caldow">${d}</div>`).join('');
  for(let i=0;i<primeiro;i++)cal+='<div class="calday empty"></div>';
  for(let d=1;d<=nDias;d++){
    const dt=new Date(repAno,repMes,d),wknd=(dt.getDay()===0||dt.getDay()===6);
    const isHoje=(d===hoje.getDate()&&repMes===hoje.getMonth()&&repAno===hoje.getFullYear());
    const chips=(porDia[d]||[]).map(x=>`<div class="chip${x.ant?' ant':''}" title="${x.nome}${x.ant?' (antecipado do dia '+x.orig+')':''}">${x.nome}${x.ant?' ⚠':''}</div>`).join('');
    cal+=`<div class="calday${wknd?' wknd':''}${isHoje?' hoje':''}" onclick="addRepasseDia(${d})"><div class="d">${d}</div>${chips}</div>`;
  }
  cal+='</div>';
  // lista embaixo (ordenada por dia)
  const ordenada=[...repItens].sort((a,b)=>Number(a['Dia'])-Number(b['Dia']));
  const lista=ordenada.length? ordenada.map(it=>`<div class="repitem"><span class="dia">dia ${it['Dia']}</span><span class="nm">${it['Proprietário']}</span><button class="rm" onclick="removerRepasse('${it['ID']}')">🗑</button></div>`).join('') : '<div class="msg">Nenhum repasse fixo cadastrado. Clique num dia do calendário para adicionar.</div>';
  v.innerHTML=`<div class="calwrap">
    <div class="calbar"><button class="btn ghost" onclick="mudarMes(-1)">‹</button>
      <b style="min-width:150px;text-align:center">${MESES[repMes]} ${repAno}</b>
      <button class="btn ghost" onclick="mudarMes(1)">›</button>
      <span class="msg" style="margin-left:auto">Fim de semana antecipa p/ sexta ⚠</span></div>
    ${cal}
    <div class="replist"><label>Repasses fixos</label>${lista}</div>
  </div>`;
}
function mudarMes(d){repMes+=d;if(repMes<0){repMes=11;repAno--;}if(repMes>11){repMes=0;repAno++;}renderRepasses();}
async function addRepasseDia(dia){
  const nomes=(cache['Proprietários']||[]).map(p=>p['Proprietário']).filter(Boolean).sort();
  const nome=await escolherProprietario(nomes,dia);
  if(!nome)return;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'addRepasse',dia:dia,proprietario:nome})});
    const d=await r.json();if(d.ok){repItens.push({'ID':d.id,'Dia':dia,'Proprietário':nome});renderRepasses();}else toast('Erro: '+(d.erro||'?'));}
  catch(e){toast('Falha de conexão.');}
}
function escolherProprietario(nomes,dia){
  return new Promise(res=>{
    let h=`<div class="mhead"><div><h2>Repasse fixo — dia ${dia}</h2></div><button class="x" onclick="fechar()">×</button></div>
      <div class="mbody"><label>Proprietário</label>`+combo('id="repProp"',nomes,'')+`</div>
      <div class="mfoot"><button class="save" id="repok">Adicionar</button><span class="msg" id="repmsg"></span></div>`;

    $('#repok').onclick=()=>{const nome=$('#modal').querySelector('#repProp').value.trim();if(!nome){$('#repmsg').textContent='Escolha um proprietário.';return;}fechar();res(nome);};
    $('#ov').addEventListener('click',function h2(e){if(e.target.id==='ov'){$('#ov').removeEventListener('click',h2);res(null);}});
  });
}
async function removerRepasse(id){
  const bk=repItens.find(x=>x['ID']===id);if(!bk)return;
  setSync('saving');
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'excluirRepasse',id})});
    const d=await r.json();
    if(d.ok){repItens=repItens.filter(x=>x['ID']!==id);renderRepasses();setSync('');
      toast('Repasse de '+bk['Proprietário']+' removido.',async()=>{
        setSync('saving');
        const rr=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'addRepasse',dia:bk['Dia'],proprietario:bk['Proprietário']})});
        const dd=await rr.json();if(dd.ok){repItens.push({'ID':dd.id,'Dia':bk['Dia'],'Proprietário':bk['Proprietário']});renderRepasses();setSync('');toast('Restaurado.');}else setSync('err');});
    } else {setSync('err');toast('Erro: '+(d.erro||'?'));}}
  catch(e){setSync('err');toast('Falha de conexão.');}
}

function vinculosDe(aba,item){
  const ims=cache['Imóveis']||[];

    });

function pn(s){return parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;}
/* FIX centavos: divide em partes de 2 casas e joga a sobra na ÚLTIMA unidade — a soma sempre fecha com o valor cheio */
function dividirCentavos(total,n){
  const cent=Math.round(total*100);
  const base=Math.floor(cent/n);
  const sobra=cent-base*n;
  const partes=[];
  for(let i=0;i<n;i++)partes.push((base+(i===n-1?sobra:0))/100);
  return partes;
}
function gerar(){

    const cota=pn(k.valor)/div;

   ls.forEach(x=>h+=`<div style="margin-bottom:6px"><div class="fields">
    <div class="f" onclick="cp(this,'${money(x.valor)}')"><div class="k">Valor</div><div class="v">${money(x.valor)}</div><span class="cp">copiar</span></div>

/* ================= GUIAS: passo a passo / lembretes ================= */
let gAtual=null,gModoAtivo='ler',gDirty=false;
async function telaGuias(force){
  $('#list').style.display='none';$('#state').textContent='';
  const v=$('#rateioView');v.style.display='';
  v.innerHTML='<div class="msg" style="padding:20px">Carregando guias...</div>';
  let guias;
  try{
    if(force)delete cache['Guias'];
    const r=cache['Guias']?{itens:cache['Guias']}:await aiPost({action:'listar',aba:'Guias'});
    if(r.erro)throw new Error('aba ausente');
    guias=cache['Guias']=r.itens||[];
  }catch(e){
    v.innerHTML='<div class="card2" style="max-width:640px;margin:0 auto;padding:16px"><b>A aba de Guias ainda não existe.</b><br><span class="msg">Abra uma vez esta URL para criar (e volte aqui):</span><br><a href="'+API+'?action=initGuias" target="_blank" style="color:#5fd6a0">'+API+'?action=initGuias</a></div>';
    return;
  }
  if(gAtual&&!guias.find(g=>String(g['ID'])===String(gAtual)))gAtual=null;
  if(!gAtual&&guias.length)gAtual=String(guias[0]['ID']);
  const g=guias.find(x=>String(x['ID'])===String(gAtual));
  const lista=guias.map(x=>`<div onclick="gSel('${eH(String(x['ID']))}')" style="padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;${String(x['ID'])===String(gAtual)?'background:rgba(95,214,160,.15);border-left:3px solid #5fd6a0':'background:rgba(255,255,255,.03)'}">
    <b style="font-size:13px">${eH(String(x['Título']||'(sem título)'))}</b><br><span class="msg" style="font-size:11px">${eH(String(x['Atualizado']||''))}</span></div>`).join('');
  v.innerHTML=`<div class="card2" style="max-width:1050px;margin:0 auto">
    <h2 style="margin:0 0 8px">Guias <span class="msg" style="font-size:12px;font-weight:normal">· passo a passo para não esquecer</span></h2>
    <div style="display:flex;gap:14px;align-items:flex-start">
      <div style="width:230px;flex-shrink:0">
        <button class="btn solid" style="width:100%;margin-bottom:8px" onclick="gNovo()">+ novo tópico</button>
        ${lista||'<div class="msg" style="padding:8px">nenhum tópico ainda</div>'}
      </div>
      <div style="flex:1;min-width:0">${g?`
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
          <input id="gTit" value="${eH(String(g['Título']||''))}" oninput="gDirty=true" style="flex:1;min-width:180px;font-weight:bold;font-size:15px">
          ${['ler','editar','mapa'].map(m=>`<button class="btn ${gModoAtivo===m?'solid':'ghost'}" onclick="gModo('${m}')">${m==='ler'?'📖 ler':m==='editar'?'✎ editar':'🧠 mapa'}</button>`).join('')}
          <button class="btn solid" id="gSalvarBtn" onclick="gSalvar()">salvar</button>
          <button class="btn ghost" title="excluir este tópico" onclick="gExcluir()" style="color:#ff8a8a">excluir</button>
        </div>
        <div id="gCorpo"></div>`:'<div class="msg" style="padding:20px">crie um tópico ao lado para começar.</div>'}
      </div>
    </div></div>`;
  if(g)gRenderCorpo(g);
}
function gSel(id){if(gDirty&&!confirm('Há alterações não salvas. Trocar de tópico mesmo assim?'))return;gDirty=false;window._mapa=null;window._mapaDe=null;mpSel=null;gAtual=id;telaGuias();}
function gModo(m){
  if(gModoAtivo==='editar'&&m!=='editar'){const ta=$('#gTexto');if(ta){const g=(cache['Guias']||[]).find(x=>String(x['ID'])===String(gAtual));if(g)g['Conteúdo']=ta.value;}}
  gModoAtivo=m;telaGuias();
}
function gRenderCorpo(g){
  const c=$('#gCorpo'),txt=String(g['Conteúdo']||'');
  if(gModoAtivo==='editar'){
    c.innerHTML=`<textarea id="gTexto" oninput="gDirty=true" style="width:100%;min-height:420px;font-size:13.5px;line-height:1.55;font-family:inherit">${eH(txt)}</textarea>
    <div class="msg" style="margin-top:6px">Dica: "# título" vira seção · "1." ou "-" viram passos · <b>2 espaços de recuo</b> por nível viram ramos no 🧠 mapa mental.</div>`;
  }else if(gModoAtivo==='mapa'){
    if(!window._mapa||window._mapaDe!==String(g['ID'])){window._mapa=mpCarrega(g);window._mapaDe=String(g['ID']);mpSel=window._mapa.i;}
    mpPinta();
  }else{
    c.innerHTML=`<div style="padding:6px 2px;font-size:14px;line-height:1.7">${gTextoHTML(txt)}</div>`;
  }
}
function gTextoHTML(txt){
  let n=0;
  return txt.split('\n').map(l=>{
    const t=l.trim();
    if(!t)return '<div style="height:8px"></div>';
    if(/^#/.test(t))return `<div style="font-weight:bold;font-size:16px;color:#5fd6a0;margin-top:10px">${eH(t.replace(/^#+\s*/,''))}</div>`;
    if(/^(\d+[.)]|-)\s/.test(t)){n++;return `<div style="display:flex;gap:8px;margin:3px 0"><span style="color:#5fd6a0;font-weight:bold;min-width:22px">${t.match(/^\d+/)?t.match(/^\d+/)[0]+'.':'•'}</span><span>${eH(t.replace(/^(\d+[.)]|-)\s*/,''))}</span></div>`;}
    return `<div>${eH(t)}</div>`;
  }).join('');
}
function gArvore(txt){
  const root={t:'',filhos:[]},pilha=[{nivel:-1,no:root}];
  txt.split('\n').forEach(l=>{
    if(!l.trim())return;
    const nivel=Math.floor((l.match(/^[ \t]*/)[0].replace(/\t/g,'  ').length)/2);
    const no={t:l.trim().replace(/^(#+|\d+[.)]|-)\s*/,''),filhos:[]};
    while(pilha.length>1&&pilha[pilha.length-1].nivel>=nivel)pilha.pop();
    pilha[pilha.length-1].no.filhos.push(no);
    pilha.push({nivel,no});
  });
  return root;
}
async function gNovo(){
  const t=prompt('Título do novo tópico:');
  if(!t)return;
  const r=await aiPost({action:'adicionar',aba:'Guias',dados:{'Título':t,'Conteúdo':'# '+t+'\n1. primeiro passo...\n','Atualizado':aiHoje()}});
  if(r.ok){delete cache['Guias'];gAtual=null;gModoAtivo='editar';await telaGuias(true);
    const guias=cache['Guias']||[];const novo=guias.find(g=>String(g['Título'])===t);
    if(novo){gAtual=String(novo['ID']);telaGuias();}}
  else alert('erro ao criar: '+(r.erro||'?'));
}
async function gSalvar(){
  const g=(cache['Guias']||[]).find(x=>String(x['ID'])===String(gAtual));
  if(!g)return;
  const btn=$('#gSalvarBtn');if(btn){btn.textContent='salvando...';btn.disabled=true;}
  const ta=$('#gTexto');
  const conteudo=ta?ta.value:String(g['Conteúdo']||'');
  const titulo=($('#gTit')&&$('#gTit').value.trim())||'(sem título)';
  const mapaJson=(window._mapa&&window._mapaDe===String(gAtual))?JSON.stringify(window._mapa):String(g['Mapa']||'');
  const r=await aiPost({action:'salvar',aba:'Guias',chaveCol:'ID',chave:gAtual,dados:{'Título':titulo,'Conteúdo':conteudo,'Mapa':mapaJson,'Atualizado':aiHoje()}});
  if(r.ok){g['Título']=titulo;g['Conteúdo']=conteudo;g['Mapa']=mapaJson;g['Atualizado']=aiHoje();gDirty=false;
    if(btn){btn.textContent='✓ salvo';setTimeout(()=>{btn.textContent='salvar';btn.disabled=false;},1200);}}
  else{alert('erro ao salvar: '+(r.erro||'?'));if(btn){btn.textContent='salvar';btn.disabled=false;}}
}
async function gExcluir(){
  const g=(cache['Guias']||[]).find(x=>String(x['ID'])===String(gAtual));
  if(!g)return;
  if(!confirm('Excluir o tópico "'+(g['Título']||'')+'"? Isso não pode ser desfeito.'))return;
  const r=await aiPost({action:'excluir',aba:'Guias',id:gAtual});
  if(r.ok){delete cache['Guias'];gAtual=null;gDirty=false;window._mapa=null;window._mapaDe=null;telaGuias(true);}
  else alert('erro: '+(r.erro||'?'));
}
/* ---- mapa mental interativo: estrutura própria, independente do texto ---- */
let mpSel=null,mpDrag=null;
function mpId(){return 'n'+Math.random().toString(36).slice(2,8);}
function mpNo(t){return {i:mpId(),t:t||'novo',c:[]};}
function mpFind(no,id,pai){
  if(no.i===id)return {no,pai:pai||null,idx:pai?pai.c.indexOf(no):-1};
  for(const f of (no.c||[])){const r=mpFind(f,id,no);if(r)return r;}
  return null;
}
function mpDesc(no,id){if(no.i===id)return true;return (no.c||[]).some(f=>mpDesc(f,id));}
function mpAddFilho(root,id){const r=mpFind(root,id);if(!r)return null;const n=mpNo();r.no.c=r.no.c||[];r.no.c.push(n);r.no.f=0;return n.i;}
function mpAddIrmao(root,id){const r=mpFind(root,id);if(!r||!r.pai)return mpAddFilho(root,root.i);const n=mpNo();r.pai.c.splice(r.idx+1,0,n);return n.i;}
function mpDel(root,id){const r=mpFind(root,id);if(!r||!r.pai)return false;r.pai.c.splice(r.idx,1);return true;}
function mpMove(root,id,d){const r=mpFind(root,id);if(!r||!r.pai)return false;const j=r.idx+d;if(j<0||j>=r.pai.c.length)return false;
  const a=r.pai.c;[a[r.idx],a[j]]=[a[j],a[r.idx]];return true;}
function mpIndent(root,id){const r=mpFind(root,id);if(!r||!r.pai||r.idx===0)return false;
  const irmao=r.pai.c[r.idx-1];r.pai.c.splice(r.idx,1);irmao.c=irmao.c||[];irmao.c.push(r.no);irmao.f=0;return true;}
function mpOutdent(root,id){const r=mpFind(root,id);if(!r||!r.pai)return false;
  const rp=mpFind(root,r.pai.i);if(!rp||!rp.pai)return false;
  r.pai.c.splice(r.idx,1);rp.pai.c.splice(rp.idx+1,0,r.no);return true;}
function mpReparent(root,id,alvoId){
  if(id===alvoId)return false;
  const r=mpFind(root,id);if(!r||!r.pai)return false;
  if(mpDesc(r.no,alvoId))return false;
  const a=mpFind(root,alvoId);if(!a)return false;
  r.pai.c.splice(r.idx,1);a.no.c=a.no.c||[];a.no.c.push(r.no);a.no.f=0;delete r.no.fx;delete r.no.fy;return true;
}
/* ---- layout: bilateral balanceado + ramos afilados + cor por ramo ---- */
const MP_COR=['#5fd6a0','#e9c15f','#7db8ff','#ff9a76','#c78fff','#4fd1c5','#f28b82','#a3d977'];
let mpZ=1;
function mpDim(no,lv){
  const t=String(no.t||''),CH=lv===0?7.6:(lv===1?7.1:6.8),MAXW=lv===0?230:(lv===1?200:186);
  const pad=lv>=2?12:26,base=lv===0?36:(lv===1?32:24);
  const cabe=Math.floor((MAXW-pad)/CH);
  if(t.length<=Math.min(22,cabe))return {w:Math.max(lv===0?96:74,t.length*CH+pad),h:base,ln:1,lv};
  const ln=Math.min(3,Math.ceil(t.length/cabe));
  return {w:MAXW,h:base+(ln-1)*17,ln,lv};
}
function mpLinhas(t,ln,w){
  if(ln<=1)return [t];
  const porLn=Math.floor(((w||182)-24)/6.8),out=[];let s=String(t);
  for(let k=0;k<ln;k++){
    if(k===ln-1){out.push(s.length>porLn?s.slice(0,porLn-1)+'…':s);break;}
    let corte=s.lastIndexOf(' ',porLn);if(corte<porLn*0.5)corte=porLn;
    out.push(s.slice(0,corte));s=s.slice(corte).trim();
    if(!s)break;
  }
  return out;
}
function mpPrep(no,lv,ramo){
  no._lv=lv;no._d=mpDim(no,lv);
  no._ramo=lv<=1?ramo:ramo; // cor herdada do ramo de 1º nível
  (no.c||[]).forEach((f,k)=>mpPrep(f,lv+1,lv===0?k:ramo));
}
/* divide os ramos de 1º nível entre direita e esquerda equilibrando a altura (auto-balance) */
function mpSplit(kids){
  if(kids.length<=3)return {R:kids.slice(),L:[]};
  const tot=kids.reduce((s,k)=>s+k._h,0);
  let acc=0,melhor=0,dif=Infinity;
  for(let k=0;k<kids.length-1;k++){
    acc+=kids[k]._h;
    const d=Math.abs(acc-(tot-acc));
    if(d<dif){dif=d;melhor=k+1;}
  }
  return {R:kids.slice(0,melhor),L:kids.slice(melhor)};
}
function mpLayout(root){
  mpPrep(root,0,0);
  const VG=11,COL=46,PAD=14;
  const vis=no=>(no.f?[]:(no.c||[]));
  const autoK=no=>vis(no).filter(f=>f.fx==null);
  const freeK=no=>vis(no).filter(f=>f.fx!=null);
  const alt=no=>{const fs=autoK(no);no._h=fs.length?fs.reduce((s,f)=>s+alt(f),0):no._d.h+VG;return no._h;};
  const pos=(no,anc,y0,dir)=>{no._x=dir>0?anc:anc-no._d.w;no._y=y0+no._h/2;no._dir=dir;pilha(no,dir);};
  const pilha=(no,dir)=>{ // filhos automáticos empilhados + filhos livres na posição guardada
    let acc=no._y-autoK(no).reduce((s,f)=>s+f._h,0)/2;
    autoK(no).forEach(f=>{pos(f,dir>0?(no._x+no._d.w+COL):(no._x-COL),acc,dir);acc+=f._h;});
    freeK(no).forEach(f=>{alt(f);f._x=f.fx;f._y=f.fy;f._dir=(f._x>=no._x)?1:-1;f._livre=1;pilha(f,f._dir);});
  };
  const kids=autoK(root);
  kids.forEach(alt);
  const {R,L}=mpSplit(kids);
  const hR=R.reduce((s,k)=>s+k._h,0),hL=L.reduce((s,k)=>s+k._h,0);
  root._h=Math.max(hR,hL,root._d.h+VG);
  root._x=0;root._y=0;root._dir=0;root._livre=0;
  let ac=-hR/2;R.forEach(k=>{pos(k,root._d.w+COL,ac,1);ac+=k._h;});
  ac=-hL/2;L.forEach(k=>{pos(k,-COL,ac,-1);ac+=k._h;});
  freeK(root).forEach(f=>{alt(f);f._x=f.fx;f._y=f.fy;f._dir=(f._x>=root._x)?1:-1;f._livre=1;pilha(f,f._dir);});
  const nos=mpNos(root);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  nos.forEach(n=>{minX=Math.min(minX,n._x);maxX=Math.max(maxX,n._x+n._d.w);
    minY=Math.min(minY,n._y-n._d.h/2);maxY=Math.max(maxY,n._y+n._d.h/2);});
  const dx=PAD-minX,dy=PAD-minY;
  nos.forEach(n=>{n._x+=dx;n._y+=dy;});
  return {w:maxX-minX+PAD*2,h:maxY-minY+PAD*2};
}
function mpOut(no,dir){const y=no._lv>=2?(no._y+no._d.h/2-1):no._y;return {x:dir>0?no._x+no._d.w:no._x,y};}
function mpIn(no,dir){const y=no._lv>=2?(no._y+no._d.h/2-1):no._y;return {x:dir>0?no._x:no._x+no._d.w,y};}
function mpRamo(a,b,dir){
  const p=mpOut(a,dir),q=mpIn(b,dir);
  const t1=Math.max(1.6,5-(a._lv||0)*1.3),t2=Math.max(1.1,t1*0.5);
  const dx=Math.max(18,Math.abs(q.x-p.x)*0.5)*(dir>0?1:-1);
  return `M ${p.x} ${p.y-t1} C ${p.x+dx} ${p.y-t1}, ${q.x-dx} ${q.y-t2}, ${q.x} ${q.y-t2} L ${q.x} ${q.y+t2} C ${q.x-dx} ${q.y+t2}, ${p.x+dx} ${p.y+t1}, ${p.x} ${p.y+t1} Z`;
}
function mpNos(root,out){out=out||[];out.push(root);(root.f?[]:(root.c||[])).forEach(f=>mpNos(f,out));return out;}
function mpArestas(root,out){out=out||[];(root.f?[]:(root.c||[])).forEach(f=>{out.push([root,f]);mpArestas(f,out);});return out;}
function mpDeArvore(no){const n=mpNo(no.t||'item');n.c=(no.filhos||[]).map(mpDeArvore);return n;}
function mpCarrega(g){
  const raw=String(g['Mapa']||'').trim();
  if(raw){try{const j=JSON.parse(raw);if(j&&j.i)return j;}catch(e){}}
  return mpNo(String(g['Título']||'Guia')); // começa vazio: o mapa é seu, não do texto
}
function mpRender(){
  const root=window._mapa;
  const {w,h}=mpLayout(root);
  const cor=no=>no._lv===0?'#9aa6b2':MP_COR[(no._ramo||0)%MP_COR.length];
  const ramos=mpArestas(root).map(([a,b])=>`<path d="${mpRamo(a,b,b._dir)}" fill="${cor(b)}" opacity=".55"/>`).join('');
  const nos=mpNos(root).map(no=>{
    const c=cor(no),sel=mpSel===no.i,nf=(no.c||[]).length,d=no._d,lv=no._lv,dir=no._dir||1;
    const txt=mpLinhas(no.t,d.ln,d.w).map(l=>`<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${eH(l)}</div>`).join('');
    let est;
    if(lv===0)est=`background:linear-gradient(135deg,#2e7d5b,#1f6a7d);border:2px solid #5fd6a0;border-radius:11px;font-weight:bold;font-size:14px;color:#eafff5`;
    else if(lv===1)est=`background:${c}1f;border:1.8px solid ${c};border-radius:9px;font-weight:600;font-size:13px`;
    else est=`background:transparent;border:0;border-bottom:2px solid ${c};border-radius:0;font-size:12.5px;padding-bottom:2px`;
    const tgl=nf?`<span class="mpTgl" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();mpTgl('${no.i}')" style="color:${c}">${no.f?'▸'+nf:'▾'}</span>`:'';
    const btns=`<div class="mpBtns">
        <span class="mpB" title="novo filho" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();mpFilhoDe('${no.i}')">+</span>
        ${no._livre?`<span class="mpB" title="voltar ao layout automático" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();mpSnap('${no.i}')">⌂</span>`:''}
        ${no.i!==root.i?`<span class="mpB" title="excluir" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();mpDelDe('${no.i}')" style="color:#ff8a8a">×</span>`:''}
      </div>`;
    return `<div class="mpNo${sel?' mpSel':''}${no._livre?' mpLivre':''}" data-id="${no.i}" style="left:${no._x}px;top:${no._y-d.h/2}px;width:${d.w}px;height:${d.h}px;${est}">
      ${dir<0?btns:tgl}<div class="mpTxt">${txt}</div>${dir<0?tgl:btns}</div>`;}).join('');
  return `<style>
    .mpNo{position:absolute;display:flex;align-items:center;gap:5px;padding:0 8px;cursor:grab;user-select:none;box-sizing:border-box;line-height:16px;transition:filter .12s}
    .mpNo:hover{filter:brightness(1.3)} .mpSel{box-shadow:0 0 0 2px rgba(95,214,160,.5)}
    .mpTxt{flex:1;overflow:hidden} .mpTgl{cursor:pointer;font-size:11px;font-weight:bold;flex-shrink:0}
    .mpBtns{display:none;gap:3px;flex-shrink:0} .mpNo:hover .mpBtns{display:flex}
    .mpB{cursor:pointer;width:17px;height:17px;line-height:16px;text-align:center;border-radius:5px;background:rgba(255,255,255,.14);font-weight:bold;font-size:13px}
    .mpB:hover{background:rgba(95,214,160,.4)} .mpAlvo{outline:2px dashed #5fd6a0;outline-offset:3px}
    .mpLivre{border-style:dashed !important} .mpArrasta{opacity:.85;cursor:grabbing;z-index:9;filter:brightness(1.4)}
  </style>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
      <button class="btn ghost" onclick="mpOp('filho')" title="Tab">+ filho</button>
      <button class="btn ghost" onclick="mpOp('irmao')" title="Enter">+ irmão</button>
      <button class="btn ghost" onclick="mpOp('sobe')">↑</button><button class="btn ghost" onclick="mpOp('desce')">↓</button>
      <button class="btn ghost" onclick="mpOp('indent')" title="vira filho do de cima">→</button>
      <button class="btn ghost" onclick="mpOp('outdent')" title="sobe um nível">←</button>
      <span style="width:8px"></span>
      <button class="btn ghost" onclick="mpZoom(-1)">−</button><span class="msg" style="min-width:38px;text-align:center">${Math.round(mpZ*100)}%</span><button class="btn ghost" onclick="mpZoom(1)">+</button>
      <span style="flex:1"></span>
      <button class="btn ghost" onclick="mpAuto()" title="volta todos os nós ao layout automático">reorganizar</button>
      <button class="btn ghost" onclick="mpImportar()" title="cria os nós a partir do texto (substitui o mapa)">importar do texto</button>
      <button class="btn ghost" style="color:#ff8a8a" onclick="mpLimpar()">limpar</button>
  </div>
  <div class="msg" style="margin-bottom:6px">arraste para <b>posicionar livre</b> · solte <b>em cima de outro nó</b> para virar filho dele · <b>+</b> cria filho · duplo clique renomeia · ⌂ volta ao automático</div>
  <div id="mpTela" style="position:relative;overflow:auto;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px;min-height:260px;max-height:62vh" tabindex="0">
      <div style="width:${Math.round(w*mpZ)}px;height:${Math.round(h*mpZ)}px">
      <div style="position:relative;width:${w}px;height:${h}px;transform:scale(${mpZ});transform-origin:0 0">
        <svg width="${w}" height="${h}" style="position:absolute;left:0;top:0;pointer-events:none">${ramos}</svg>${nos}</div></div></div>`;
}
function mpSnap(id){const r=mpFind(window._mapa,id);if(!r)return;delete r.no.fx;delete r.no.fy;gDirty=true;mpPinta();}
function mpAuto(){mpNos(window._mapa).forEach(n=>{delete n.fx;delete n.fy;});gDirty=true;mpPinta();}
function mpZoom(d){mpZ=Math.max(0.5,Math.min(1.5,Math.round((mpZ+d*0.1)*10)/10));mpPinta();}
function mpPinta(){const c=$('#gCorpo');if(!c)return;c.innerHTML=mpRender();mpLiga();}
function mpTgl(id){const r=mpFind(window._mapa,id);if(!r)return;r.no.f=r.no.f?0:1;gDirty=true;mpPinta();}
function mpFilhoDe(id){mpSel=id;const n=mpAddFilho(window._mapa,id);gDirty=true;mpPinta();if(n){mpSel=n;mpPinta();mpEdita(n);}}
function mpDelDe(id){
  const r=mpFind(window._mapa,id);if(!r||!r.pai)return;
  if((r.no.c||[]).length&&!confirm('Excluir "'+r.no.t+'" e seus '+r.no.c.length+' filho(s)?'))return;
  const pai=r.pai.i;mpDel(window._mapa,id);mpSel=pai;gDirty=true;mpPinta();
}
function mpImportar(){
  const g=(cache['Guias']||[]).find(x=>String(x['ID'])===String(gAtual));if(!g)return;
  const arv=gArvore(String(g['Conteúdo']||''));
  if(!arv.filhos.length){alert('o texto está vazio.');return;}
  if(!confirm('Isso substitui o mapa atual pelos itens do texto (a indentação vira hierarquia). Continuar?'))return;
  const root=mpNo(String(g['Título']||'Guia'));
  root.c=arv.filhos.map(mpDeArvore);
  window._mapa=root;mpSel=root.i;gDirty=true;mpPinta();
}
function mpLimpar(){
  if(!confirm('Apagar todos os nós do mapa?'))return;
  const g=(cache['Guias']||[]).find(x=>String(x['ID'])===String(gAtual));
  window._mapa=mpNo(g?String(g['Título']||'Guia'):'Guia');mpSel=window._mapa.i;gDirty=true;mpPinta();
}
function mpOp(op){
  const root=window._mapa;
  if(!mpSel||!mpFind(root,mpSel))mpSel=root.i;
  let novo=null,ok=true;
  if(op==='filho')novo=mpAddFilho(root,mpSel);
  else if(op==='irmao')novo=mpAddIrmao(root,mpSel);
  else if(op==='del'){const r=mpFind(root,mpSel);
    if(!r||!r.pai){alert('a raiz não pode ser excluída (renomeie o tópico no título).');return;}
    return mpDelDe(mpSel);}
  else if(op==='sobe')ok=mpMove(root,mpSel,-1);
  else if(op==='desce')ok=mpMove(root,mpSel,1);
  else if(op==='indent')ok=mpIndent(root,mpSel);
  else if(op==='outdent')ok=mpOutdent(root,mpSel);
  if(novo){mpSel=novo;gDirty=true;mpPinta();mpEdita(novo);return;}
  if(ok)gDirty=true;
  mpPinta();
}
function mpEdita(id){
  const el=document.querySelector('.mpNo[data-id="'+id+'"]');if(!el)return;
  const r=mpFind(window._mapa,id);if(!r)return;
  el.innerHTML='<input id="mpInp" value="'+eH(r.no.t)+'" style="width:100%;height:22px;font-size:12.5px;padding:0 4px;border-radius:5px">';
  const inp=$('#mpInp');inp.focus();inp.select();
  const fim=s=>{if(s){const v=inp.value.trim();if(v){r.no.t=v;gDirty=true;}}mpPinta();};
  inp.onblur=()=>fim(true);
  inp.onmousedown=e=>e.stopPropagation();
  inp.onkeydown=e=>{e.stopPropagation();
    if(e.key==='Enter'){e.preventDefault();fim(true);}
    if(e.key==='Escape'){e.preventDefault();fim(false);}};
}
function mpLiga(){
  const tela=$('#mpTela');if(!tela)return;
  const raiz=window._mapa;
  tela.querySelectorAll('.mpNo').forEach(el=>{
    const id=el.dataset.id;
    el.onclick=e=>{e.stopPropagation();if(mpDrag&&mpDrag.mov){mpDrag=null;return;}mpSel=id;mpPinta();};
    el.ondblclick=e=>{e.stopPropagation();mpSel=id;mpEdita(id);};
    el.onmousedown=e=>{
      if(e.target.tagName==='INPUT')return;
      e.preventDefault();
      mpDrag={id,el,x0:e.clientX,y0:e.clientY,ox:el.offsetLeft,oy:el.offsetTop,mov:false};
      mpSel=id;
    };
  });
  const alvoSob=e=>[...tela.querySelectorAll('.mpNo')].find(el=>{
    if(el.dataset.id===mpDrag.id)return false;
    const r=el.getBoundingClientRect();
    return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;});
  tela.onmousemove=e=>{
    if(!mpDrag)return;
    const dx=(e.clientX-mpDrag.x0)/mpZ,dy=(e.clientY-mpDrag.y0)/mpZ;
    if(!mpDrag.mov&&Math.abs(dx)+Math.abs(dy)<5)return;
    mpDrag.mov=true;mpDrag.el.classList.add('mpArrasta');
    mpDrag.el.style.left=(mpDrag.ox+dx)+'px';mpDrag.el.style.top=(mpDrag.oy+dy)+'px';
    const alvo=alvoSob(e);
    tela.querySelectorAll('.mpNo').forEach(el=>el.classList.toggle('mpAlvo',!!alvo&&el===alvo));
  };
  const fim=e=>{
    if(!mpDrag)return;
    const d=mpDrag;mpDrag=null;
    if(!d.mov)return;
    d.el.classList.remove('mpArrasta');
    const alvo=alvoSob({clientX:e.clientX,clientY:e.clientY,__id:d.id})||null;
    if(alvo){ // soltou em cima de outro nó: vira filho dele
      if(mpReparent(raiz,d.id,alvo.dataset.id)){gDirty=true;mpSel=d.id;}
      else alert('não dá para mover um nó para dentro dele mesmo ou de um filho dele.');
      mpPinta();return;
    }
    const r=mpFind(raiz,d.id);
    if(!r||!r.pai){mpPinta();return;} // a raiz é a âncora do mapa: não fica livre
    const no=r.no,h=no._d?no._d.h:30;
    no.fx=parseFloat(d.el.style.left)-raiz._x;      // posição guardada relativa à raiz
    no.fy=parseFloat(d.el.style.top)+h/2-raiz._y;
    gDirty=true;mpSel=d.id;mpPinta();
  };
  tela.onmouseup=fim;
  tela.onmouseleave=e=>{if(mpDrag&&mpDrag.mov)fim(e);else mpDrag=null;};
  tela.onkeydown=e=>{
    if(!mpSel)return;
    if(e.key==='Tab'){e.preventDefault();mpOp('filho');}
    else if(e.key==='Enter'){e.preventDefault();mpOp('irmao');}
    else if(e.key==='Delete'){e.preventDefault();mpOp('del');}
    else if(e.key==='F2'){e.preventDefault();mpEdita(mpSel);}
  };
}
/* ---- combo (seletor moderno com busca + criar novo) ---- */
function combo(hiddenSelector,valores,valorAtual){
  // retorna HTML; wire depois com wireCombos()
  return `<div class="combo" data-combo><input type="hidden" ${hiddenSelector} value="${(valorAtual||'').replace(/"/g,'&quot;')}">
    <input class="cbsearch" placeholder="Buscar ou criar..." value="${(valorAtual||'').replace(/"/g,'&quot;')}" autocomplete="off">
    <div class="list" data-valores='${JSON.stringify(valores).replace(/'/g,"&#39;")}'></div></div>`;
}
function wireCombos(scope){
  (scope||document).querySelectorAll('[data-combo]').forEach(function(c){
    if(c._wired)return;c._wired=true;
    const hid=c.querySelector('input[type=hidden]'), inp=c.querySelector('.cbsearch'), list=c.querySelector('.list');
    const vals=JSON.parse(list.getAttribute('data-valores')||'[]');
    function draw(f){
      f=(f||'').toLowerCase();const m=vals.filter(v=>v.toLowerCase().includes(f));
      let h=m.map(v=>`<div class="opt" data-v="${v.replace(/"/g,'&quot;')}">${v}</div>`).join('');
      const exato=vals.some(v=>v.toLowerCase()===f);
      if(f&&!exato)h+=`<div class="opt new" data-new="${inp.value.replace(/"/g,'&quot;')}">+ criar "${inp.value}"</div>`;
      list.innerHTML=h||'<div class="opt" style="color:var(--mut)">nada</div>';
    }
    inp.onfocus=()=>{draw(inp.value);c.classList.add('open');};
    inp.oninput=()=>{hid.value=inp.value;draw(inp.value);c.classList.add('open');};
    list.onclick=e=>{const o=e.target.closest('.opt');if(!o)return;const v=o.dataset.v!=null?o.dataset.v:o.dataset.new;inp.value=v;hid.value=v;c.classList.remove('open');};
    document.addEventListener('click',e=>{if(!c.contains(e.target))c.classList.remove('open');});
  });
}

async function verDuplicados(){
  const modal=$('#modal');
  modal.innerHTML=`<div class="mhead"><div><h2>Duplicados</h2><div class="cpf">revisão — nada é excluído automaticamente</div></div><button class="x" onclick="fechar()">×</button></div><div class="mbody"><div class="msg">Carregando...</div></div>`;
  $('#ov').classList.add('on');document.body.style.overflow='hidden';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'duplicados'})});
    const d=await r.json();if(!d.ok){modal.querySelector('.mbody').innerHTML='Erro: '+(d.erro||'?');return;}
    const D=d.dup;let h='<div class="dupwrap">';
    function bloco(titulo,grupos,fmt){
      if(!grupos.length)return `<div class="msg">${titulo}: nenhum ✓</div>`;
      let x=`<div><div class="h" style="color:var(--acc);margin-bottom:6px">${titulo} (${grupos.length})</div>`;
      grupos.forEach(g=>{x+=`<div class="dupgrp"><div class="h">${g.length} iguais</div>`+g.map(fmt).join('')+`</div>`;});
      return x+'</div>';
    }
    h+=bloco('Imóveis (mesmo endereço)',D.imoveis,it=>`<div class="dupitem">#${it.cod} · ${it.prop||'—'} <span style="opacity:.6">(${it.id||''})</span> — ${it.endereco||''}</div>`);
    h+=bloco('Proprietários (mesmo CPF)',D.proprietarios,it=>`<div class="dupitem">${it.nome} · ${it.cpf} <span style="opacity:.6">(${it.id||''})</span></div>`);
    h+='</div>';
    modal.querySelector('.mbody').innerHTML=h;
  }catch(e){modal.querySelector('.mbody').innerHTML='Falha de conexão.';}
}
